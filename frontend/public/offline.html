<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Offline — MechMind AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 60%, #134e4a 130%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(13, 148, 136, 0.25);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #042f2e;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; }
    .status {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fcd34d;
      font-size: 12px;
      font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fbbf24; animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    button {
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      background: #0d9488;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">M</div>
    <h1>You're offline</h1>
    <p>MechMind AI can't reach the server right now. Cached manuals and field fixes are still available — retry once you're back online.</p>
    <span class="status"><span class="dot"></span> OFFLINE MODE</span>
    <br />
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
